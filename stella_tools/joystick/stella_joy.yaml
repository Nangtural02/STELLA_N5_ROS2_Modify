teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: false
    enable_turbo_button: 4    # LB - 정밀 제어

    axis_linear:
      x: 1
    scale_linear:
      x: 0.3
    scale_linear_turbo:
      x: 0.1

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.5
    scale_angular_turbo:
      yaw: 0.2
